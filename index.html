<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your Name · Social Media Manager</title>
<meta name="description" content="Photography, reels and graphic design for social media management and creative marketing.">
<style>
:root{--paper:#f2f1ee;--ink:#000;--char:#2b2b2a;--mid:#6f6f6b;--line:#d4d3ce;--gap:clamp(12px,2vw,28px);--pad:clamp(20px,4vw,56px);color-scheme:light}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font:400 1rem/1.55 "Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img,video,iframe{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
main:focus{outline:0}
[hidden]{display:none!important}
.skip{position:absolute;left:-999px;top:0;background:var(--ink);color:var(--paper);padding:.5rem 1rem;z-index:9}
.skip:focus{left:0}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.note{background:var(--ink);color:var(--paper);font-size:.8rem;padding:.5rem var(--pad)}
.bar{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:.75rem 2rem;padding:1.25rem var(--pad)}
.mark{font-weight:600;letter-spacing:-.02em}
.bar nav{display:flex;flex-wrap:wrap;gap:.25rem 1.5rem;font-size:.9rem;color:var(--char)}
.bar nav a{padding-bottom:2px;border-bottom:1px solid transparent;transition:border-color .2s}
.bar nav a:hover,.bar nav a[aria-current]{border-color:var(--ink);color:var(--ink)}
.wrap{padding-inline:var(--pad)}
.hero{padding:clamp(40px,9vw,130px) var(--pad) clamp(40px,7vw,100px)}
.hero h1,.h{font-weight:600;letter-spacing:-.045em;line-height:.95}
.hero h1{font-size:clamp(2.5rem,8.5vw,8rem);max-width:15ch}
.hero p{margin:clamp(24px,4vw,56px) 0 0 auto;max-width:30rem;color:var(--char);font-size:1.1rem}
.h{font-size:clamp(2.2rem,6vw,5rem);margin-bottom:clamp(24px,4vw,56px)}
.page{padding-top:clamp(24px,5vw,72px);padding-bottom:clamp(48px,8vw,120px)}
.grid{columns:3 260px;column-gap:var(--gap)}
.tile{display:block;width:100%;text-align:left;break-inside:avoid;margin-bottom:var(--gap)}
.tile img{width:100%;height:auto;transition:opacity .25s}
.tile:hover img{opacity:.8}
.cap{display:flex;justify-content:space-between;gap:1rem;padding-top:.5rem;font-size:.85rem}
.cap small{color:var(--mid);font-size:inherit;text-align:right}
.filters{display:flex;flex-wrap:wrap;gap:.25rem 1.5rem;margin:-1.5rem 0 2rem;color:var(--mid)}
.filters button{padding:0 0 2px;border-bottom:1px solid transparent}
.filters button:hover,.filters button[aria-pressed=true]{color:var(--ink);border-color:var(--ink)}
.areas{display:block;margin-block:clamp(48px,8vw,120px)}
.areas a{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:.5rem 2rem;padding:1rem 0;border-top:1px solid var(--line);font-size:clamp(1.8rem,5vw,4rem);letter-spacing:-.035em;font-weight:600;transition:padding .25s}
.areas a:last-child{border-bottom:1px solid var(--line)}
.areas a:hover{padding-left:.75rem}
.areas small{font-size:.9rem;font-weight:400;letter-spacing:0;color:var(--mid)}
.cta{padding-bottom:clamp(56px,9vw,130px)}
.cta p,.lead{color:var(--char);font-size:1.1rem;max-width:36rem}
.big{display:inline-block;margin-top:.5rem;font-size:clamp(1.6rem,5vw,4rem);letter-spacing:-.035em;font-weight:600;border-bottom:2px solid var(--ink);line-height:1.15;overflow-wrap:anywhere}
.big:hover{color:var(--mid);border-color:var(--mid)}
.reels{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:calc(var(--gap)*1.5) var(--gap)}
.reel{aspect-ratio:9/16;background:var(--char);overflow:hidden}
.reel video,.reel iframe,.reel img{width:100%;height:100%;object-fit:cover;border:0}
.reels h2{font-size:1.1rem;margin-top:.75rem;letter-spacing:-.01em}
.reels p{font-size:.9rem;color:var(--char)}
.reels .role{color:var(--mid)}
.split{display:grid;grid-template-columns:3fr 2fr;gap:var(--gap) clamp(24px,6vw,96px);align-items:start}
.split p+p{margin-top:1rem;color:var(--char)}
.split .lead{font-size:clamp(1.3rem,2.6vw,2rem);line-height:1.3;letter-spacing:-.02em;color:var(--ink);max-width:none}
.split img{width:100%;height:auto}
.svc{list-style:none;margin-top:clamp(40px,7vw,100px)}
.svc li{display:flex;justify-content:space-between;flex-wrap:wrap;gap:.25rem 2rem;padding:1rem 0;border-top:1px solid var(--line);font-size:1.3rem;letter-spacing:-.02em;font-weight:600}
.svc li:last-child{border-bottom:1px solid var(--line)}
.svc small{font-size:.95rem;font-weight:400;letter-spacing:0;color:var(--mid);max-width:26rem}
.soc{list-style:none;display:flex;flex-wrap:wrap;gap:.25rem 1.75rem;margin-top:clamp(32px,5vw,64px)}
.soc a{border-bottom:1px solid var(--ink)}
.soc a:hover{color:var(--mid);border-color:var(--mid)}
.foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:.5rem;padding:1.25rem var(--pad);border-top:1px solid var(--line);font-size:.85rem;color:var(--mid)}
.foot a:hover{color:var(--ink)}
#lb{border:0;background:transparent;width:100%;height:100%;max-width:100vw;max-height:100vh;padding:0}
#lb::backdrop{background:rgba(0,0,0,.94)}
.lbin{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:var(--pad);color:var(--paper)}
.lbin img{max-width:100%;max-height:70vh;width:auto;height:auto;object-fit:contain}
.lbcap{max-width:40rem;text-align:center;font-size:.9rem}
.lbcap span{color:#a5a5a0}.lbcap p{margin-top:.25rem;color:#cfcfca}
.lbnav{display:flex;gap:1.5rem;align-items:center;font-size:.9rem}
.lbin button{padding:.25rem .5rem;border-bottom:1px solid transparent}
.lbin button:hover{border-color:var(--paper)}
.lbin :focus-visible{outline-color:var(--paper)}
.lbx{position:absolute;top:1rem;right:var(--pad)}
@media (max-width:700px){.grid{columns:2 140px}.split{grid-template-columns:1fr}.hero p{margin-left:0}}
@media (max-width:420px){.grid{columns:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div id="note" class="note" hidden>Placeholder content. Replace it by following the README.</div>
<header class="bar">
  <a class="mark" id="mark" href="#home">Your Name</a>
  <nav aria-label="Main">
    <a href="#photography">Photography</a>
    <a href="#reels">Reels</a>
    <a href="#design">Graphic Design</a>
    <a href="#about">About</a>
    <a href="#contact">Contact</a>
  </nav>
</header>
<main id="main" tabindex="-1"><noscript><p class="page">This portfolio needs JavaScript to display its work.</p></noscript></main>
<footer class="foot"><span id="foot"></span><a id="footmail" href="#contact">Contact</a></footer>
<dialog id="lb" aria-label="Image viewer">
  <div class="lbin">
    <button class="lbx" id="close" type="button">Close</button>
    <img id="lbimg" alt="">
    <div id="lbcap" class="lbcap"></div>
    <div class="lbnav"><button id="prev" type="button">Previous</button><span id="lbn"></span><button id="next" type="button">Next</button></div>
  </div>
</dialog>
<script>
/* ==========================================================
   ALL YOUR CONTENT LIVES HERE. Edit text, add or reorder items.
   Everything marked [Placeholder] is sample content to replace.
   Images: put files in assets/ and set src: "assets/photos/name.jpg".
   Leave src empty ("") to show a grey placeholder.
   w and h = image width and height in pixels (keeps layout stable).
   Order on the page = order in each list.
   ========================================================== */

const SITE = {
  showPlaceholderNotice: true,          // set to false when you go live
  name: "Your Name",                    // [Placeholder]
  headline: "Photography, reels and design, made to be seen.",
  intro: "I manage social media and create the photos, videos and graphics that fill it. [Placeholder: write two sentences about your work.]",
  areas: {
    photography: "Church, events, portraits",
    reels: "Short-form video",
    design: "Social graphics, carousels, campaigns"
  },
  ctaText: "Need help with your social media?",
  email: "hello@example.com",           // [Placeholder]
  socials: [                            // [Placeholders] remove or edit
    { label: "Instagram", url: "https://instagram.com/yourhandle" },
    { label: "TikTok",    url: "https://tiktok.com/@yourhandle" },
    { label: "LinkedIn",  url: "https://linkedin.com/in/yourname" }
  ],
  about: [
    "[Placeholder] Write a short introduction here: who you are, where you work, and what you care about when you make things.",
    "[Placeholder] A second paragraph is optional."
  ],
  portrait: { src: "", w: 800, h: 1000, alt: "Portrait of the photographer" }, // [Placeholder]
  services: [
    { title: "Social media management", text: "[Placeholder] Planning, scheduling and posting." },
    { title: "Content creation",        text: "[Placeholder] Photo and video for your channels." },
    { title: "Creative marketing",      text: "[Placeholder] Campaign concepts and graphics." }
  ],
  contactText: "Tell me about your brand and what you want to achieve. I will reply by email."
};

/* group = filter label on the Photography page. featured:true = shown on Home. */
const PHOTOS = [
  { group: "Church",    src: "", w: 1600, h: 1067, caption: "[Placeholder] Sunday service",   role: "Photography", alt: "", featured: true },
  { group: "Church",    src: "", w: 1067, h: 1600, caption: "[Placeholder] Worship team",     role: "Photography", alt: "" },
  { group: "Events",    src: "", w: 1600, h: 1067, caption: "[Placeholder] Conference",       role: "Photography", alt: "", featured: true },
  { group: "Events",    src: "", w: 1280, h: 1600, caption: "[Placeholder] Launch night",     role: "Photography", alt: "" },
  { group: "Portraits", src: "", w: 1280, h: 1600, caption: "[Placeholder] Portrait session", role: "Photography", alt: "" },
  { group: "Portraits", src: "", w: 1600, h: 1067, caption: "[Placeholder] Team portraits",   role: "Photography", alt: "" }
];

/* video: local file ("assets/reels/name.mp4") OR embed: iframe URL. poster: cover image path. */
const REELS = [
  { title: "[Placeholder] Event recap",       role: "Filming, editing",          description: "Short description of the project and what you did.", video: "", embed: "", poster: "", featured: true },
  { title: "[Placeholder] Brand intro",       role: "Concept, filming, editing", description: "Short description of the project and what you did.", video: "", embed: "", poster: "" },
  { title: "[Placeholder] Behind the scenes", role: "Editing",                   description: "Short description of the project and what you did.", video: "", embed: "", poster: "" }
];

/* Each project can have several images (carousel slides, a campaign set, etc.). */
const DESIGN = [
  { title: "[Placeholder] Carousel", role: "Graphic design", description: "Short description of the brief and your work.", featured: true,
    images: [ { src: "", w: 1080, h: 1350 }, { src: "", w: 1080, h: 1350 }, { src: "", w: 1080, h: 1350 } ] },
  { title: "[Placeholder] Event poster", role: "Concept, graphic design", description: "Short description of the brief and your work.",
    images: [ { src: "", w: 1200, h: 1700 } ] },
  { title: "[Placeholder] Campaign set", role: "Concept, graphic design", description: "Short description of the brief and your work.",
    images: [ { src: "", w: 1600, h: 900 }, { src: "", w: 1080, h: 1080 } ] },
  { title: "[Placeholder] Story templates", role: "Graphic design", description: "Short description of the brief and your work.",
    images: [ { src: "", w: 1080, h: 1920 }, { src: "", w: 1080, h: 1920 } ] }
];

(() => {
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const tones = ["#2b2b2a", "#3b3b39", "#555552", "#1d1d1c", "#6a6a66", "#444442"];
  const tone = k => { let h = 0; for (const c of String(k)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return tones[h % tones.length]; };
  const ph = (w, h, k) => "data:image/svg+xml," + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><rect width="${w}" height="${h}" fill="${tone(k)}"/><text x="50%" y="50%" fill="#fff" fill-opacity=".55" font-family="Arial,sans-serif" font-size="${Math.round(Math.min(w, h) / 12)}" text-anchor="middle">Placeholder</text></svg>`);
  const src = i => i.src || ph(i.w, i.h, i.title || i.caption || i.alt || i.w + "x" + i.h);
  const img = i => `<img src="${esc(src(i))}" alt="${esc(i.alt || i.caption || i.title || "")}" width="${i.w}" height="${i.h}" loading="lazy" decoding="async">`;
  const cap = (a, b) => `<span class="cap"><span>${esc(a)}</span><small>${esc(b || "")}</small></span>`;
  const mail = () => `mailto:${esc(SITE.email)}`;
  let flt = "All", set = [], cur = 0;

  const photoList = () => PHOTOS.filter(p => flt === "All" || p.group === flt);
  const photoTiles = () => photoList().map((p, i) =>
    `<button class="tile" type="button" data-set="photo" data-i="${i}">${img(p)}${cap(p.caption, p.role)}</button>`).join("");

  const V = {
    home() {
      const f = [
        ...PHOTOS.filter(p => p.featured).map(p => ({ ...p, sec: "photography", label: "Photography", t: p.caption })),
        ...DESIGN.filter(d => d.featured).map(d => ({ ...d.images[0], alt: d.title, title: d.title, sec: "design", label: "Graphic design", t: d.title })),
        ...REELS.filter(r => r.featured).map(r => ({ src: r.poster, w: 1080, h: 1920, alt: r.title, title: r.title, sec: "reels", label: "Reels", t: r.title }))
      ];
      const area = (id, name) => `<a href="#${id}"><span>${name}</span><small>${esc(SITE.areas[id])}</small></a>`;
      return `<section class="hero"><h1>${esc(SITE.headline)}</h1><p>${esc(SITE.intro)}</p></section>
        <section class="wrap"><h2 class="vh">Featured work</h2><div class="grid">${f.map(x =>
          `<a class="tile" href="#${x.sec}">${img(x)}${cap(x.t, x.label)}</a>`).join("")}</div></section>
        <nav class="areas wrap" aria-label="Work areas">${area("photography", "Photography")}${area("reels", "Reels")}${area("design", "Graphic Design")}</nav>
        <section class="cta wrap"><p>${esc(SITE.ctaText)}</p><a class="big" href="${mail()}">${esc(SITE.email)}</a></section>`;
    },
    photography() {
      const g = ["All", ...new Set(PHOTOS.map(p => p.group))];
      return `<section class="page wrap"><h1 class="h">Photography</h1>
        <div class="filters" role="group" aria-label="Filter photography by project">${g.map(x =>
          `<button type="button" data-f="${esc(x)}" aria-pressed="${x === flt}">${esc(x)}</button>`).join("")}</div>
        <div class="grid" id="pg">${photoTiles()}</div></section>`;
    },
    reels() {
      const media = r => r.video
        ? `<video controls playsinline preload="metadata" ${r.poster ? `poster="${esc(r.poster)}"` : ""} src="${esc(r.video)}"></video>`
        : r.embed
          ? `<iframe src="${esc(r.embed)}" title="${esc(r.title)}" loading="lazy" allowfullscreen></iframe>`
          : `<img src="${esc(r.poster || ph(1080, 1920, r.title))}" alt="Placeholder: add a video for ${esc(r.title)}" width="1080" height="1920">`;
      return `<section class="page wrap"><h1 class="h">Reels</h1><div class="reels">${REELS.map(r =>
        `<article><div class="reel">${media(r)}</div><h2>${esc(r.title)}</h2><p class="role">${esc(r.role)}</p><p>${esc(r.description)}</p></article>`).join("")}</div></section>`;
    },
    design() {
      return `<section class="page wrap"><h1 class="h">Graphic Design</h1><div class="grid">${DESIGN.map((d, i) =>
        `<button class="tile" type="button" data-set="design" data-i="${i}">${img({ ...d.images[0], title: d.title, alt: d.title })}${cap(d.title, d.images.length > 1 ? d.role + ", " + d.images.length + " images" : d.role)}</button>`).join("")}</div></section>`;
    },
    about() {
      return `<section class="page wrap about"><h1 class="h">About</h1>
        <div class="split"><div>${SITE.about.map((t, i) => `<p class="${i ? "" : "lead"}">${esc(t)}</p>`).join("")}</div>
        <div>${img(SITE.portrait)}</div></div>
        <h2 class="vh">Services</h2><ul class="svc">${SITE.services.map(s => `<li><span>${esc(s.title)}</span><small>${esc(s.text)}</small></li>`).join("")}</ul></section>`;
    },
    contact() {
      return `<section class="page wrap"><h1 class="h">Contact</h1><p class="lead">${esc(SITE.contactText)}</p>
        <a class="big" href="${mail()}">${esc(SITE.email)}</a>
        <ul class="soc">${SITE.socials.map(s => `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)}</a></li>`).join("")}</ul></section>`;
    }
  };
  const titles = { home: "", photography: "Photography", reels: "Reels", design: "Graphic Design", about: "About", contact: "Contact" };

  function route() {
    let h = location.hash.slice(1);
    if (h === "main") return;
    if (!V[h]) h = "home";
    const m = $("#main");
    m.innerHTML = V[h]();
    document.title = (titles[h] ? titles[h] + " · " : "") + SITE.name;
    document.querySelectorAll(".bar nav a").forEach(a => a.getAttribute("href") === "#" + h ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
    window.scrollTo(0, 0);
    m.focus({ preventScroll: true });
  }

  /* Lightbox */
  const lb = $("#lb");
  const show = () => {
    const s = set[cur];
    $("#lbimg").src = s.src; $("#lbimg").alt = s.alt || "";
    $("#lbcap").innerHTML = `<strong>${esc(s.t)}</strong>${s.r ? ` <span>${esc(s.r)}</span>` : ""}${s.d ? `<p>${esc(s.d)}</p>` : ""}`;
    $("#lbn").textContent = set.length > 1 ? `${cur + 1} / ${set.length}` : "";
    $("#prev").hidden = $("#next").hidden = set.length < 2;
  };
  const step = d => { cur = (cur + d + set.length) % set.length; show(); };
  function open(kind, i) {
    if (kind === "photo") {
      set = photoList().map(p => ({ src: src(p), alt: p.alt || p.caption, t: p.caption, r: p.role, d: p.description }));
      cur = i;
    } else {
      const d = DESIGN[i];
      set = d.images.map(im => ({ src: src({ ...im, title: d.title }), alt: im.alt || d.title, t: d.title, r: d.role, d: d.description }));
      cur = 0;
    }
    show();
    lb.showModal();
  }

  document.addEventListener("click", e => {
    const t = e.target.closest("[data-set]");
    if (t) return open(t.dataset.set, +t.dataset.i);
    const f = e.target.closest("[data-f]");
    if (f) {
      flt = f.dataset.f;
      document.querySelectorAll("[data-f]").forEach(b => b.setAttribute("aria-pressed", b === f));
      $("#pg").innerHTML = photoTiles();
    }
    if (e.target.classList.contains("skip")) { e.preventDefault(); $("#main").focus(); }
    if (e.target === lb || e.target.classList.contains("lbin")) lb.close();
  });
  $("#close").onclick = () => lb.close();
  $("#prev").onclick = () => step(-1);
  $("#next").onclick = () => step(1);
  lb.addEventListener("keydown", e => { if (set.length > 1 && e.key === "ArrowLeft") step(-1); if (set.length > 1 && e.key === "ArrowRight") step(1); });

  /* Boot */
  $("#mark").textContent = SITE.name;
  $("#foot").textContent = "© " + new Date().getFullYear() + " " + SITE.name;
  $("#footmail").textContent = SITE.email; $("#footmail").href = "mailto:" + SITE.email;
  if (SITE.showPlaceholderNotice) $("#note").hidden = false;
  addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
